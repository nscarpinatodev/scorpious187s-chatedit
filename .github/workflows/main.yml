name: Release Creation

on:
  release:
    types: [published]

# The release-action step needs write access to upload assets to the release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Combine CSS files into a single CSS file
      - name: Combine CSS files
        run: cat styles/*.css > chatedit.css

      # Strip the leading `v` from the tag (e.g. v0.9.0 -> 0.9.0).
      - name: Extract tag version number
        id: get_version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}

      # Point the manifest at the bundled files, drop HotReload, and stamp the
      # version / URLs. Same for full and pre-releases.
      - name: Modify Manifest
        uses: microsoft/variable-substitution@v1
        with:
          files: "module.json"
        env:
          flags.hotReload: false
          version: ${{ steps.get_version.outputs.version }}
          url: https://github.com/${{ github.repository }}
          manifest: https://github.com/${{ github.repository }}/releases/latest/download/module.json
          download: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip
          styles: '["chatedit.css"]'
          esmodules: '["chatedit.mjs"]'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: 'npm'

      # `npm ci` is recommended:
      # https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
      - name: Install Dependencies
        run: npm ci

      - name: Build All
        run: npm run build

      - name: Create ZIP archive
        run: zip -r ./module.zip module.json chatedit.mjs chatedit.css lang/ templates/

      # Attach the manifest and package to the release that triggered this run,
      # preserving its prerelease flag.
      - name: Update Release with Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: false
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./module.json, ./module.zip"
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
